<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hogar360</title>
<script defer src="https://t.contentsquare.net/uxa/2ef797b508cc5.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--n:#123274;--n2:#0b3c88;--l:#82c91e;--b:#d7dbe0;--bg:#f4f5f7;--t:#1f2430;--g:#6b7280;--z:1}
body.hc{--n:#000;--n2:#000;--l:#4d7c0f;--b:#000;--bg:#fff;--t:#000;--g:#000}
*{box-sizing:border-box;margin:0;font-family:'Work Sans',system-ui,sans-serif}
body{background:#e9ecf1;display:flex;justify-content:center;min-height:100vh;color:var(--t)}
#app{width:100%;max-width:402px;height:100vh;max-height:877px;margin:auto;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column}
@media(min-width:440px){#app{border-radius:32px;border:1px solid var(--b);box-shadow:0 20px 50px #0002}}
#scr{flex:1;overflow-y:auto;zoom:var(--z)}
.hd{display:flex;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid var(--b);position:sticky;top:0;background:#fff;z-index:2}
.hd h1{font-size:18px;font-weight:800;flex:1}
.ib{width:36px;height:36px;border-radius:18px;background:var(--bg);border:0;display:grid;place-items:center;cursor:pointer;position:relative;color:var(--t)}
.pad{padding:20px 24px 24px;display:flex;flex-direction:column;gap:16px}
.box{background:var(--bg);border-radius:24px;padding:16px}
.box b{color:var(--n);font-size:14px;display:flex;gap:8px;align-items:center;margin-bottom:8px}
.box p,.sm{font-size:14px;line-height:18px;color:var(--g)}
label{font-weight:700;font-size:14px;display:block;margin-bottom:6px}
.in{width:100%;border:1px solid var(--b);border-radius:12px;padding:12px 16px;font-size:14px;font-weight:600;color:var(--t);background:#fff;outline:0}
.in:focus{border-color:var(--n)}
.btn{height:48px;border-radius:12px;border:1px solid transparent;font-weight:700;font-size:14px;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.p{background:var(--l);color:#fff}.o{background:#fff;border-color:var(--b);color:var(--n)}.nv{background:var(--n);color:#fff}
.card{border:1px solid var(--b);border-radius:24px;padding:20px;position:relative;box-shadow:0 4px 12px #0000000d;background:#fff}
.ph{border-radius:20px;background-size:cover}
.h{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:17px;background:#fff;border:0;display:grid;place-items:center;color:#e5484d;cursor:pointer;box-shadow:0 2px 6px #0002}
.fe{display:flex;border-top:1px solid var(--b);margin-top:16px;padding-top:14px;font-size:12px;color:var(--g)}
.fe div{flex:1;text-align:center;border-right:1px solid var(--b);display:flex;flex-direction:column;align-items:center;gap:4px}.fe div:last-child{border:0}
.price{font-size:22px;font-weight:800;color:var(--n)}
.ver{background:var(--l);color:#fff;border:0;border-radius:8px;padding:6px 26px;font-weight:800;font-size:11px;cursor:pointer}
.row{display:flex;align-items:center;gap:14px;padding:16px;border-bottom:1px solid var(--b);cursor:pointer;font-weight:600;font-size:15px}
.row:last-child{border:0}.row span:first-child{flex:1}
.ic{width:40px;height:40px;border-radius:20px;background:var(--bg);display:grid;place-items:center;color:var(--n);flex:none}
.tg{width:48px;height:24px;border-radius:12px;background:var(--b);position:relative;border:0;cursor:pointer;flex:none}
.tg:after{content:'';position:absolute;top:4px;left:4px;width:16px;height:16px;border-radius:8px;background:#fff;transition:.2s}
.tg.on{background:var(--l)}.tg.on:after{left:28px}
.sec{font-size:12px;font-weight:700;letter-spacing:.8px;color:var(--g);text-transform:uppercase}
nav{display:flex;justify-content:space-around;padding:10px 0 12px;background:#fff;box-shadow:inset 0 2px 2px #00000026;border-radius:0 0 32px 32px}
nav button{background:0;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:#4d4d4d;cursor:pointer;position:relative;width:70px;padding-top:6px}
nav button.a{color:var(--n);font-weight:700}nav button.a:before{content:'';position:absolute;top:-10px;width:24px;height:3px;border-radius:2px;background:var(--n)}
.bd{position:absolute;top:2px;right:18px;background:#f08c00;color:#fff;font-size:9px;border-radius:6px;min-width:12px;height:12px;display:grid;place-items:center;font-weight:700}
.av{width:41px;height:41px;border-radius:50%;background:var(--n);color:#fff;font-weight:800;display:grid;place-items:center;flex:none}
.mod{position:absolute;inset:0;background:#000a;display:grid;place-items:center;z-index:9;zoom:1}
.mod div{background:#fff;border-radius:20px;padding:24px;text-align:center;width:80%;display:flex;flex-direction:column;gap:14px;align-items:center}
.ts{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);background:var(--t);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:10;white-space:nowrap}
.logo{background:var(--n);color:#fff;font-weight:800;font-size:28px;border-radius:20px;padding:22px 30px;text-align:center;letter-spacing:-.5px}.logo i{color:var(--l);font-style:normal}
.bar{height:8px;border-radius:4px;background:var(--bg)}.bar i{display:block;height:100%;background:var(--l);border-radius:4px}
input[type=range]{width:100%;accent-color:var(--n)}
.badge{background:#eaf6d5;color:#4d7c0f;font-size:11px;font-weight:700;padding:5px 12px;border-radius:12px;display:inline-block}
.bg{background:#fdecc8;color:#a15c00}
</style>
</head>

reg:()=>hd('Registrarse')+`<div class="pad"><input data-cs-mask id="rn" class="in" placeholder="Nombre completo"><input data-cs-mask id="re" class="in" type="email" placeholder="Correo electrónico"><input data-cs-mask id="rp" class="in" type="password" placeholder="Contraseña (mín. 6)"><input data-cs-mask id="rc" class="in" type="password" placeholder="Confirmar contraseña"><button class="btn p" data-a="reg">CREAR CUENTA</button></div>`,
home:()=>{const l=P.filter(p=>(p.n+p.z).toLowerCase().includes(q.toLowerCase()));return `<div class="hd" style="gap:10px"><button class="ib" data-a="go" data-v="profile" style="background:none"><span class="av">${ini()}</span></button><div style="flex:1"><b style="font-size:16px;font-weight:800;display:block">Hola, ${(S.u?.name||'').split(' ')[0]}</b><span class="sm" style="font-size:12px">Panel principal</span></div><button class="ib" data-a="go" data-v="notifs" aria-label="Notificaciones">${I('bell')}<span class="bd" style="right:2px">${ST.length+S.vis.length}</span></button></div><div class="pad"><div style="position:relative"><span style="position:absolute;left:14px;top:13px;color:var(--g)">${I('search',18)}</span><input data-cs-mask id="q" class="in" style="padding-left:42px;border-radius:16px" placeholder="Buscar proyecto o ciudad" value="${q}"></div>${l.map(p=>`<div class="card"><button class="h" data-a="fav" data-v="${p.id}" aria-label="Favorito">${I('heart',18,S.fav.includes(p.id)?'#e5484d':'#e5484d').replace('fill="none"',S.fav.includes(p.id)?'fill="#e5484d"':'fill="none"')}</button><div style="display:flex;gap:18px"><div class="ph" style="width:129px;height:149px;background:linear-gradient(160deg,${p.g})"></div><div style="flex:1;display:flex;flex-direction:column;gap:6px;padding-top:8px"><b style="font-weight:800;font-size:14px;padding-right:30px">${p.n}</b><span style="font-size:13px;display:flex;gap:4px;align-items:center">${I('pin',14,'#82c91e')}${p.z}</span><span class="price">$${F(p.p)}</span><button class="ver" data-a="detail" data-v="${p.id}" style="align-self:flex-start">VER</button></div></div>${feat(p)}</div>`).join('')||'<p class="sm" style="text-align:center">Sin resultados</p>'}</div>`},
detail:()=>{const p=P.find(x=>x.id==arg);return hd('Apartamento')+`<div class="pad"><div class="ph" style="height:210px;background:linear-gradient(160deg,${p.g})"></div><div><span class="price" style="font-size:28px">$${F(p.p)}</span><h2 style="font-size:20px;font-weight:800;margin-top:2px">${p.n}</h2><p class="sm" style="display:flex;gap:4px;align-items:center">${I('pin',14,'#82c91e')}${p.z}</p></div><div class="card" style="padding:16px">${feat(p).replace('margin-top:16px','')}<p class="sm" style="margin-top:14px">${p.d}</p></div><button class="btn nv" data-a="agenda" data-v="${p.id}">Agendar visita</button><button class="btn o" data-a="go" data-v="sim">Simulador de crédito</button><button class="btn p" data-a="adv">Hablar con un asesor</button></div>`},
sim:()=>{const r=.0035,n=sim.yrs*12,c=.4*sim.ing*(1-Math.pow(1+r,-n))/r,t=Math.round((c+sim.ini)/1e6)*1e6;return hd('Simulador')+`<div class="pad"><div class="box"><b>${I('info',18,'#123274')}Así calculamos tu capacidad</b><p>Evaluamos tus ingresos, ahorros de cuota inicial y el plazo para estimar un cupo de crédito responsable bajo las regulaciones LATAM vigentes.</p></div><div><label>Ingresos mensuales</label><input data-cs-mask class="in" data-m="ing" inputmode="numeric" value="${F(sim.ing)}"></div><div><label>Cuota inicial disponible</label><input data-cs-mask class="in" data-m="ini" inputmode="numeric" value="${F(sim.ini)}"></div><div><label style="display:flex;justify-content:space-between">Plazo del crédito<span id="yr" style="color:var(--n)">${sim.yrs} años</span></label><input data-cs-mask type="range" min="5" max="20" value="${sim.yrs}" id="yrs"><div class="sm" style="display:flex;justify-content:space-between;font-size:11px"><span>5 años</span><span>20 años</span></div></div><div style="background:var(--n2);color:#fff;border-radius:24px;padding:20px"><p style="font-size:12px;font-weight:700;opacity:.8;color:#fff">TU CAPACIDAD ESTIMADA</p><div id="cap" style="font-size:32px;font-weight:800;margin:8px 0">$${F(t)}</div><p style="font-size:13px;color:#fff;display:flex;gap:6px;align-items:center">${I('check',14,'#82c91e')}Basado en tus datos actuales</p></div><button class="btn p" data-a="adv">Hablar con un asesor</button><button class="btn o" data-a="go" data-v="home">Volver al Panel</button></div>`},
agenda:()=>{const p=P.find(x=>x.id==arg)||P[0];return hd('Agendar cita')+`<div class="pad"><div class="card" style="display:flex;gap:16px;align-items:center"><div class="ph" style="width:64px;height:64px;background:linear-gradient(160deg,${p.g})"></div><div><b style="font-weight:800">${p.n}</b><p class="sm">${p.z}</p></div></div><div><label>Fecha</label><input data-cs-mask id="fd" class="in" type="date" min="${new Date().toISOString().slice(0,10)}"></div><div><label>Hora</label><input data-cs-mask id="fh" class="in" type="time" min="08:00" max="18:00"></div><button class="btn nv" data-a="conf" data-v="${p.id}">Confirmar visita</button><button class="btn o" data-a="back">Cancelar</button></div>`},
visits:()=>hd('Mis visitas')+`<div class="pad"><p class="sec">Visitas agendadas</p>${S.vis.map((v,i)=>{const p=P.find(x=>x.id==v.p);return `<div class="card" style="padding:16px;display:flex;gap:14px;align-items:center"><div class="ic" style="width:56px;height:56px;border-radius:16px">${I('cal',24)}</div><div style="flex:1"><b style="font-size:15px">${p.n}</b><p class="sm">${new Date(v.d+'T12:00').toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'})} · ${v.h}</p><span class="badge bg" style="margin-top:6px">PENDIENTE DE CONFIRMACIÓN</span></div><button class="ib" data-a="cx" data-v="${i}" aria-label="Cancelar">${I('x',16)}</button></div>`}).join('')||'<p class="sm">Aún no tienes visitas. Agenda una desde el detalle de un proyecto.</p>'}<button class="btn nv" data-a="go" data-v="home">Ver proyectos</button><button class="btn p" data-a="adv">Hablar con un asesor</button></div>`,
notifs:()=>hd('Notificaciones')+`<div class="pad">${[...S.vis.map(v=>['Visita agendada',`${P.find(x=>x.id==v.p).n} · ${v.d} ${v.h}`,'cal','Nueva']),...ST].map(n=>`<div class="card" style="padding:16px;display:flex;gap:14px"><div class="ic" style="width:48px;height:48px;border-radius:16px">${I(n[2])}</div><div style="flex:1"><div style="display:flex;justify-content:space-between"><b style="font-size:14px">${n[0]}</b><span class="sm" style="font-size:12px">${n[3]}</span></div><p class="sm" style="margin-top:4px">${n[1]}</p></div></div>`).join('')}</div>`,

docs:()=>hd('Mis documentos')+`<div class="pad"><div class="box"><b>${I('file',18,'#123274')}Tu información, siempre a mano</b><p>Aquí encuentras y gestionas todos tus documentos relacionados con tu proceso de búsqueda y compra.</p></div>${D.map((d,i)=>`<div class="card" style="padding:16px;display:flex;gap:14px;align-items:center"><div class="ic">${I('file',18)}</div><div style="flex:1"><b style="font-size:14px">${d[0]}</b><p class="sm" style="font-size:12px">${d[1]}</p></div>${tg('d'+i,S.ds[i+1])}</div>`).join('')}<p class="sm" style="font-size:12px">Activa el interruptor cuando el documento esté cargado.</p></div>`,
sec:()=>hd('Seguridad y privacidad')+`<div class="pad"><div class="card"><div style="display:flex;align-items:center;gap:14px"><div class="ic" style="width:48px;height:48px">${I('shield')}</div><div style="flex:1"><b>Nivel de seguridad</b><p class="sm" style="font-size:12px">Protección activa</p></div><b style="font-size:24px;font-weight:800;color:var(--n)">${S.st.bio&&S.st.tfa?100:S.st.bio||S.st.tfa?75:50}%</b></div><p class="sm" style="margin:14px 0">Tus documentos y datos financieros están protegidos con encriptación AES-256 de grado bancario.</p><div class="bar"><i style="width:${S.st.bio&&S.st.tfa?100:S.st.bio||S.st.tfa?75:50}%"></i></div></div><p class="sec">Configuración de acceso</p><div class="card" style="padding:16px;display:flex;gap:14px;align-items:center"><div style="flex:1"><b style="font-size:15px">Biometría</b><p class="sm" style="font-size:12px">Huella o rostro para ingresar</p></div>${tg('bio',S.st.bio)}</div><div class="card" style="padding:16px;display:flex;gap:14px;align-items:center"><div style="flex:1"><b style="font-size:15px">Verificación en dos pasos</b><p class="sm" style="font-size:12px">Código por SMS</p></div>${tg('tfa',S.st.tfa)}</div><div class="box"><p>Ningún asesor de Hogar360 te pedirá claves bancarias o pagos fuera de la plataforma oficial de la constructora o entidad financiera.</p></div></div>`,
acc:()=>hd('Accesibilidad')+`<div class="pad"><div class="box"><b>${I('user',18,'#123274')}Hogares para todos y todas</b><p>Trabajamos para que nuestra plataforma sea inclusiva y accesible, brindando una experiencia cómoda, clara y sin barreras.</p></div><p class="sec">Configuración de accesibilidad</p><div class="card" style="padding:16px"><div style="display:flex;gap:12px;align-items:center;margin-bottom:10px"><div class="ic">${I('type',16)}</div><div><b style="font-size:15px">Tamaño de texto</b><p class="sm" style="font-size:12px">Aumenta o disminuye la letra</p></div></div><input data-cs-mask type="range" id="fs" min="90" max="130" step="10" value="${S.ac.fs}"></div><div class="card" style="padding:16px;display:flex;gap:12px;align-items:center"><div class="ic">${I('sun',16)}</div><div style="flex:1"><b style="font-size:15px">Alto contraste</b><p class="sm" style="font-size:12px">Mejora la visibilidad</p></div>${tg('hc',S.ac.hc)}</div><div class="card" style="padding:16px;display:flex;gap:12px;align-items:center"><div class="ic">${I('vol',16)}</div><div style="flex:1"><b style="font-size:15px">Asistencia por voz</b><p class="sm" style="font-size:12px">Lee los títulos de cada pantalla</p></div>${tg('vz',S.ac.vz)}</div></div>`,
help:()=>hd('Guía legal')+`<div class="pad"><div style="background:var(--n2);color:#fff;border-radius:24px;padding:24px"><h2 style="font-size:22px;font-weight:800;line-height:1.2">Entiende el Proceso Legal en Colombia</h2><p style="margin-top:10px;font-size:14px;opacity:.9">Nuestras guías están validadas por expertos en derecho inmobiliario colombiano.</p></div><p class="sec">Trámites fundamentales</p>${[['Estudio de Títulos','Análisis de la historia jurídica del inmueble de los últimos 20 años para asegurar que no tenga gravámenes o problemas legales.'],['Promesa de Compraventa','Contrato donde se pacta el precio, forma de pago y fecha de escrituración. Obliga a las partes legalmente.'],['Escrituración','Proceso ante notario público para elevar el contrato a escritura pública e inscribirlo en la oficina de registro.']].map((t,i)=>`<div class="card" style="padding:18px"><div style="display:flex;gap:12px;align-items:center"><div class="ic" style="width:44px;height:44px">${I('book',18)}</div><b style="flex:1">${t[0]}</b></div><p class="sm" style="margin-top:12px">${t[1]}</p></div>`).join('')}<button class="btn p" data-a="go" data-v="docs">EMPEZAR REVISIÓN DE DOCUMENTOS</button></div>`
};
function draw(){
 if(!S.u&&!['login','reg'].includes(cur))cur='login';
 $('#scr').innerHTML=V[cur]();$('#scr').scrollTop=0;
 document.body.classList.toggle('hc',!!S.ac.hc);$('#app').style.setProperty('--z',S.ac.fs/100);
 const auth=!['login','reg'].includes(cur),t=tab[cur];
 $('#nv').style.display=auth?'flex':'none';
 $('#nv').innerHTML=[['home','Inicio','home'],['search','Buscar','home'],['visits','Visitas','cal'],['profile','Perfil','user']].map(x=>`<button data-a="${x[0]=='search'?'srch':'go'}" data-v="${x[0]}" class="${x[0]==t?'a':''}">${I(x[2],22)}${x[1]}${x[0]=='profile'&&pend()?`<span class="bd">${pend()}</span>`:''}</button>`).join('');
 if(S.ac.vz&&window.speechSynthesis&&auth){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance((document.querySelector('h1')||{textContent:'Inicio'}).textContent))}
}
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-a]');if(!el)return;e.preventDefault();const a=el.dataset.a,v=el.dataset.v;
 const A={
 back,go:()=>{if(v=='home'||v=='visits'||v=='profile')hist=[];go(v)},
 login:()=>{const m=$('#em').value.trim(),p=$('#pw').value;if(!/^\S+@\S+\.\S+$/.test(m))return toast('Correo no válido');if(p.length<6)return toast('Contraseña mínima de 6 caracteres');const r=S.u&&S.u.email==m?S.u.name:m.split('@')[0].replace(/[._]/g,' ').replace(/\b\w/g,c=>c.toUpperCase());S.u={name:r,email:m};save();hist=[];go('home')},
 social:()=>{S.u={name:'Valentina Rodríguez',email:'valentina.rod@mail.com'};save();toast('Sesión con '+v);go('home')},
 reg:()=>{const n=$('#rn').value.trim(),m=$('#re').value.trim(),p=$('#rp').value;if(n.length<2)return toast('Escribe tu nombre');if(!/^\S+@\S+\.\S+$/.test(m))return toast('Correo no válido');if(p.length<6)return toast('Contraseña mínima de 6 caracteres');if(p!==$('#rc').value)return toast('Las contraseñas no coinciden');S.u={name:n,email:m};save();hist=[];go('home')},
 out:()=>{S.u=null;save();hist=[];go('login')},
 detail:()=>go('detail',+v),agenda:()=>go('agenda',+v),
 fav:()=>{const i=+v;S.fav=S.fav.includes(i)?S.fav.filter(x=>x!=i):[...S.fav,i];save();draw()},
 srch:()=>{go('home');$('#q').focus()},
 adv:()=>toast('Un asesor te contactará pronto'),toast:()=>toast('Próximamente'),
 conf:()=>{const d=$('#fd').value,h=$('#fh').value;if(!d||!h)return toast('Elige fecha y hora');S.vis.unshift({p:+v,d,h});save();const m=document.createElement('div');m.className='mod';m.innerHTML='<div><b style="font-size:20px;font-weight:800">Cita confirmada</b><p class="sm">Te esperamos el '+d+' a las '+h+'.</p><button class="btn p" style="width:120px;height:40px" data-a="ok">Ok</button></div>';$('#app').append(m)},
 ok:()=>{document.querySelector('.mod')?.remove();hist=[];go('visits')},
 cx:()=>{S.vis.splice(+v,1);save();draw();toast('Visita cancelada')},
 tg:()=>{if(v[0]=='d'){const k=+v.slice(1)+1;S.ds[k]=S.ds[k]?0:1}else if(v=='hc'||v=='vz')S.ac[v]=S.ac[v]?0:1;else S.st[v]=S.st[v]?0:1;save();draw()}
 };A[a]&&A[a]();
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.id=='q'){q=t.value;const pos=t.selectionStart;draw();const n=$('#q');n.focus();n.setSelectionRange(pos,pos)}
 if(t.dataset.m){sim[t.dataset.m]=+t.value.replace(/\D/g,'')||0;upd()}
 if(t.id=='yrs'){sim.yrs=+t.value;$('#yr').textContent=sim.yrs+' años';upd()}
 if(t.id=='fs'){S.ac.fs=+t.value;save();$('#app').style.setProperty('--z',S.ac.fs/100)}
});
document.addEventListener('change',e=>{if(e.target.dataset.m)e.target.value=F(sim[e.target.dataset.m])});
function upd(){const r=.0035,n=sim.yrs*12,c=.4*sim.ing*(1-Math.pow(1+r,-n))/r;$('#cap').textContent='$'+F(Math.round((c+sim.ini)/1e6)*1e6)}
cur=S.u?'home':'login';draw();
</script>
</body>
</html>
